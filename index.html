<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr. Rama Zeidan</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Parisienne&display=swap');

  :root{
    --porcelain:#F6F3ED;
    --ink:#211F1B;
    --ink-soft:#6B665D;
    --line:#DAD5C9;
    --paper:#FBFAF6;
    --taupe:#8A7B63;
    --taupe-dark:#6E6250;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--porcelain);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  .nav{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 24px;
    position:absolute;top:0;left:0;right:0;
    z-index:20;
  }
  .nav-name{font-family:'Parisienne',cursive;font-size:26px;color:#fff;line-height:1;text-shadow:0 1px 4px rgba(0,0,0,0.25);}

  .hero{
    position:relative;
    width:100%;
    height:0;
    padding-top:112%;
    overflow:hidden;
    background:#ccc;
  }
  .hero img{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    object-position:center 12%;
    display:block;
  }
  .hero-gradient{
    position:absolute;left:0;right:0;bottom:0;height:55%;
    background:linear-gradient(to top, rgba(20,18,15,0.82) 0%, rgba(20,18,15,0.45) 55%, rgba(20,18,15,0) 100%);
  }
  .hero-text{
    position:absolute;left:0;right:0;bottom:0;
    padding:24px 24px 22px;
    color:#fff;
  }
  .hero-text h1{
    font-family:'Fraunces',serif;font-weight:600;font-size:34px;
    margin:0 0 6px;text-shadow:0 1px 6px rgba(0,0,0,0.3);
  }
  .hero-text .role{
    font-family:'Fraunces',serif;font-style:italic;font-size:16px;
    margin:0 0 4px;color:rgba(255,255,255,0.92);
  }
  .hero-text .loc{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.04em;
    color:rgba(255,255,255,0.75);
  }

  .below{padding:26px 24px 8px;}
  .tagline{
    font-family:'Fraunces',serif;font-style:italic;font-size:17px;
    color:var(--ink-soft);margin:0 0 22px;line-height:1.5;
  }

  .btn-stack{display:flex;flex-direction:column;gap:10px;}
  .btn{
    display:block;
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:14px;font-weight:600;letter-spacing:0.02em;
    text-decoration:none;
    padding:15px 0;
    border-radius:3px;
    background:var(--taupe);
    color:#fff;
  }
  .btn:active{background:var(--taupe-dark);}

  .contact{
    padding:38px 24px 10px;
    text-align:center;
  }
  .contact p{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;color:var(--ink-soft);
    letter-spacing:0.04em;
    margin:0 0 8px;
  }
  .contact a{
    font-family:'Fraunces',serif;font-size:17px;
    color:var(--ink);text-decoration:none;
    border-bottom:1px solid var(--line);
    padding-bottom:2px;
  }

  footer{
    padding:26px 24px 36px;
    font-size:11px;color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
    text-align:center;
  }
</style>
</head>
<body>

<div class="nav">
  <div class="nav-name">Dr. Rama Zeidan</div>
</div>

<div class="hero">
  <img src="dr-rama-photo.png" alt="Dr. Rama Zeidan">
  <div class="hero-gradient"></div>
  <div class="hero-text">
    <h1>Dr. Rama Zeidan</h1>
    <div class="role">Dental intern &middot; Alexandria University</div>
    <div class="loc">ALEXANDRIA, EGYPT</div>
  </div>
</div>

<section class="below">
  <p class="tagline">Compassionate dental care rooted in clinical excellence.</p>

  <div class="btn-stack">
    <a class="btn" href="clinical-cases.html">Clinical Cases</a>
    <a class="btn" href="webinars.html">Webinars</a>
    <a class="btn" href="workshops.html">Workshops</a>
  </div>
</section>

<div class="contact">
  <p>GET IN TOUCH</p>
  <a href="mailto:your.email@example.com">your.email@example.com</a>
</div>

<footer>DR. RAMA ZEIDAN &mdash; 2026</footer>

</body>
</html>
